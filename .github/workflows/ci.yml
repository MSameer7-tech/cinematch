name: CineMatch CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-engine
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-asyncio httpx
        pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
    - name: Test with pytest
      run: |
        pytest tests/

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    - name: Install dependencies
      run: npm ci
    - name: Lint (ESLint)
      run: npm run lint
    - name: Type Check (TSC)
      run: npx tsc --noEmit
    - name: Test (Vitest)
      env:
        VITE_SUPABASE_URL: https://test-project.supabase.co
        VITE_SUPABASE_ANON_KEY: test-anon-key
        VITE_TMDB_TOKEN: test-tmdb-token
        VITE_TMDB_BASE_URL: https://api.themoviedb.org/3
        VITE_TMDB_IMAGE_URL: https://image.tmdb.org/t/p
        VITE_TMDB_API: test-tmdb-api-key
      run: npx vitest run
    - name: Build
      env:
        VITE_SUPABASE_URL: https://test-project.supabase.co
        VITE_SUPABASE_ANON_KEY: test-anon-key
        VITE_TMDB_TOKEN: test-tmdb-token
        VITE_TMDB_BASE_URL: https://api.themoviedb.org/3
        VITE_TMDB_IMAGE_URL: https://image.tmdb.org/t/p
        VITE_TMDB_API: test-tmdb-api-key
      run: npm run build

  docker-validation:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Test Backend Docker Build
      run: docker build -t cinematch-backend:test ./ai-engine
    - name: Test Frontend Docker Build
      run: docker build -t cinematch-frontend:test ./frontend
