version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
    ports:
      - "80:80"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_API_BASE_URL=http://api:8000/api
    depends_on:
      - api
    networks:
      - cinematch_net

  api:
    build:
      context: ./ai-engine
    ports:
      - "8000:8000"
    env_file:
      - ./ai-engine/.env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - cinematch_net

networks:
  cinematch_net:
    driver: bridge
